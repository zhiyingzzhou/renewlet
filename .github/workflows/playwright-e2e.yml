name: Playwright E2E

# schedule 固定观察默认分支 main；dev push 与相关 PR 前置守门，main/release push 不重复跑。
on:
  pull_request:
    branches:
      - dev
      - main
      - "release/**"
  push:
    branches:
      - dev
  schedule:
    - cron: "37 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/docker-server/go.mod
          cache-dependency-path: apps/docker-server/go.sum

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E
        id: playwright
        run: pnpm test:e2e

      - name: Capture E2E port diagnostics
        if: ${{ failure() && steps.playwright.outcome == 'failure' }}
        # 启动失败可能没有浏览器 trace；保留 LISTEN/TIME_WAIT 等状态，不杀进程或复用未知服务。
        run: |
          mkdir -p test-results
          {
            cat /proc/sys/net/ipv4/ip_local_port_range
            ss --tcp --all --numeric --processes '( sport = :19090 or sport = :15173 )'
          } > test-results/e2e-ports.txt
          cat test-results/e2e-ports.txt

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-e2e-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
