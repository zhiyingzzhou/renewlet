name: Security Scan

# 安全扫描独立于功能质量门：PR 能看到依赖/镜像风险，release 前也不会被普通构建冒烟吞掉信号。
on:
  pull_request:
    branches:
      - dev
      - main
      - "release/**"
  push:
    branches:
      - dev
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/docker-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: apps/docker-server/go.mod
          cache-dependency-path: apps/docker-server/go.sum

      - name: Install govulncheck
        # Go 官方漏洞库按代码可达性分析；固定 Go 版本，工具本身随官方 vuln DB 更新。
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...

  pnpm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level high

  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # 依赖风险由独立 pnpm-audit job 负责；镜像扫描不在宿主机重复安装整套 workspace。
      - name: Resolve build time
        run: echo "RENEWLET_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build scan image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            VERSION=0.0.0-dev
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ env.RENEWLET_BUILD_TIME }}
          load: true
          push: false
          tags: renewlet:security-scan

      - name: Install Grype
        id: grype
        # Anchore 官方子 action 负责固定版本的下载与 runner 工具缓存；完整 commit pin 保持安装链可审计。
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439
        with:
          grype-version: v0.119.0

      - name: Scan Docker image
        # high 及以上直接失败，且继续扫描镜像所有层；低等级 CVE 保留在输出中供版本升级时评估。
        run: "${{ steps.grype.outputs.cmd }} renewlet:security-scan --fail-on high --scope all-layers"
