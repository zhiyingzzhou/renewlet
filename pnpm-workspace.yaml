# Workspace 中 apps 是可部署入口，packages 只保留跨运行面共享库。
packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  '@tsparticles/engine': true
  esbuild: true
  sharp: true
  workerd: true
# 安全约束只覆盖漏洞版本范围，其余传递依赖通过 pnpm update 正常更新锁文件。
overrides:
  "browserslist@<=4.28.6": "^4.28.7"
  "undici@>=7.18.0 <7.30.1": "7.30.1"
  "undici@>=8.0.0 <8.12.2": "8.12.4"
# pnpm 11 默认拦截发布不足 24 小时的包；只对已审计的精确版本放行，不关闭全仓冷却期。
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.33'
  - '@ai-sdk/gateway@4.0.43'
  - '@ai-sdk/google@4.0.36'
  - '@ai-sdk/openai-compatible@3.0.25'
  - '@ai-sdk/openai@4.0.32'
  - '@ai-sdk/provider-utils@5.0.23'
  - '@ai-sdk/provider@4.0.6'
  - '@aws-sdk/client-s3@3.1104.0'
  - '@redocly/cli@2.45.0'
  - ai@7.0.55
  - lucide-react@1.29.0
  - tsx@4.23.9
  # 工程优化已审计并指定Vite版本；仅放行该版本的发布冷却期，不扩大后续升级范围。
  - vite@8.3.4
  - undici@8.12.4
