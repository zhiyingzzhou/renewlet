# Workspace 中 apps 是可部署入口，packages 只保留跨运行面共享库。
packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  '@tsparticles/engine': true
  esbuild: true
  sharp: true
  workerd: true
# pnpm 11.20 无法定向更新未直接声明的传递依赖；只将 Browserslist 漏洞范围重定向到官方修复线，不能用 audit ignore 绕过。
overrides:
  "browserslist@<=4.28.6": "^4.28.7"
# pnpm 11 默认拦截发布不足 24 小时的包；本轮明确升级到 same-day latest 时只放行精确版本，避免用 minimumReleaseAge: 0 关闭整个供应链冷却期。
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.33'
  - '@ai-sdk/gateway@4.0.43'
  - '@ai-sdk/google@4.0.36'
  - '@ai-sdk/openai-compatible@3.0.25'
  - '@ai-sdk/openai@4.0.32'
  - '@ai-sdk/provider-utils@5.0.23'
  - '@ai-sdk/provider@4.0.6'
  - '@aws-sdk/client-s3@3.1104.0'
  - '@aws-sdk/s3-request-presigner@3.1104.0'
  - '@redocly/cli@2.45.0'
  - ai@7.0.55
  - lucide-react@1.29.0
  - tsx@4.23.9
  # Wrangler 与官方同批 workerd/类型一起升级；仅放行这批精确版本，不关闭全仓冷却期或放行整个命名空间。
  - wrangler@4.131.1
  - miniflare@5.20260911.0-alpha
  - workerd@1.20260911.1
  - '@cloudflare/workers-types@5.20260911.1'
  - '@cloudflare/workerd-darwin-64@1.20260911.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260911.1'
  - '@cloudflare/workerd-linux-64@1.20260911.1'
  - '@cloudflare/workerd-linux-arm64@1.20260911.1'
  - '@cloudflare/workerd-windows-64@1.20260911.1'
